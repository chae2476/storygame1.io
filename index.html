<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>무인도 이야기</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Courier New', monospace;
      white-space: pre-line;
      padding: 20px;
    }
    #story {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    #choices {
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="story"></div>
  <div id="choices"></div>

  <script>
    const story = document.getElementById("story");
    const choices = document.getElementById("choices");

    function delay(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    async function printLine(text, time = 2000) {
      story.innerText += text + "\n";
      await delay(time);
    }

    async function printDots(count = 10, speed = 700) {
      for (let i = 0; i < count; i++) {
        story.innerText += ".";
        await delay(speed);
      }
      story.innerText += "\n";
    }

    function choose(options, callback) {
      choices.innerHTML = "";
      options.forEach(([text, value]) => {
        const btn = document.createElement("button");
        btn.innerText = text;
        btn.onclick = () => {
          choices.innerHTML = "";
          callback(value);
        };
        choices.appendChild(btn);
      });
    }

    async function startStory() {
      await printLine("세 명의 친구들이 무인도로 여행을 왔습니다.");
      await printLine("\"와, 바다다!!!\"");
      await printLine("\"근데 저녁거리는 없네...\"");
      await printLine("\"어쩔 수 없지, 오늘 저녁은 가져온 걸로 하자\"");
      await printLine("촤아악!");
      await printLine("\"아, 장난치지 마~!\"");
      await printLine("\"크크큭!\"");
      await printLine("\"으...이거나 받아랏!\"");
      await printLine("\"아, 차가!\"");
      await printLine("\"하하하!\"");
      await printLine("결국 오후가 끝나고 밤이 찾아왔습니다.");
      await printLine("\"야, 내가 무서운 이야기 들려줄까? 흐흐흐...\"");
      await printLine("\"야, 무서워, 하지마~!\"");
      await printLine("\"오~들려주라!\"");
      await printLine("\"야, 너마저! \n하...일단 알겠어...\"");
      await printLine("\"이 무인도에서 예전에 토끼 모자를 쓴 여자가 나타났었대...\"");
      await printLine("\"근데 그 사람이 이 무인도에 온 사람을 한 명...한 명...\"");
      await printLine("\"데려가서 잡아먹는대...\"");
      await printLine("\"그...그게 뭐야...\"");
      await printLine("\"꺄아악!\"");
      await printLine("\"왜, 왜 그래?\"");
      await printLine("\"바, 밖에...\"");
      await printLine("\"밖에 토끼 모자를 쓴 여자가 보였어...\"");
      await printLine("\"야, 무섭게 장난치지 마!\"");
      await printLine("\"진, 진짠데...\"");
      await printLine("\"일단 자자.\"");
      await printLine("\"내일 아침이 돼면 괜찮아 질거야.\"");
      await printLine("다음 날, 아침이 되었지만 유준이 보이지 않았습니다.");
      await printLine("\"유준이 봤어?\"");
      await printLine("\"아니...\"");
      await printLine("\"분명 괜찮을 거야\"");
      await printLine("\"아침 먹고 찾으러 가보자\"");
      await printLine("\"으,응...\"");
      await printLine("숲 속을 걸으며 찾으러 다녔지만 유준이는 보이지 않았습니다");
      await printLine("\"난 좀 더 찾아볼 테니까 너 먼저 돌아가\"");
      await printLine("\"...\"");

      choose([
        ["나도 같이 갈게", 1],
        ["알았어, 조심해...", 2],
        ["...그냥 같이 있어", 3]
      ], handleFirstChoice);
    }

    async function handleFirstChoice(choice) {
      if (choice === 1) {
        await printLine("\"나도 같이 갈게\"");
        await printLine("\"...알았어\"");
        await printLine("숲길을 같이 걷던 중 그림자가 비쳤습니다.", 3000);
        await printLine("\"어, 뭐야?\"");
        await printLine("\"쿵!\"");
        await printLine("눈 앞이 붉어지더니 쓰러졌습니다.");
        await printDots();
        await printLine("\"뉴스...치지ㅈ지직..ㅈ..\"", 3000);
        await printLine("\"지지ㅈ...최근...무인도에서...대학생...사망.....사건....\"");
        await printDots(10, 1000);
        await printLine("\"속보...피해ㅈㅏ 한 명 더...사망자가 속출...긴급 사태...\"");
        await printDots(10, 1000);
        await printLine("GAME OVER");
        await printLine("살인이 성공하였습니다...");
      }

      else if (choice === 2) {
        await printLine("\"알았어, 조심해...\"");
        await printLine("\".....\"");
        await printLine("점점 시간이 늦어집니다...");
        await printLine("\"어딨어...\"");
        await printLine("\"다들 어디 간 거야...\"");
        await printLine("\"어?\"");
        await printLine("\"이게 뭐지?\"");
        await printLine("\"책상 위에 웬 쪽지가...\"");
        await printLine("\"응?\"");
        await printLine(`┌───────────────────────────────────────────────────┐
│여러분은 각자 맡은 역할을 충실히 다해주세요.
│유준은 첫째날 밤에 괴담을 말하고 사라집니다.
│윤호는 둘째날 숲속에서 유준을 찾다가 사라집니다.
│로운은 마지막까지 남습니다.
└───────────────────────────────────────────────────┘`, 10000);
        await printLine("\"뭐야, 이게...\"");
        await printLine("\"너...\"");
        await printLine("\"보고있지...\"");
        await printLine("\"아, 어딨어...\"");
        await printLine("\"로운아...\"");
        await printLine("\"응?\"");

        choose([
          ["뒤돌아본다", 1],
          [".....", 2]
        ], handleSecondChoice);
      }

      else if (choice === 3) {
        await fullEnding3();
      }
    }

    async function handleSecondChoice(b) {
      if (b === 1) {
        await printLine("\"어?\"");
        await printLine("\"로, 로운아?\"");
        await printLine("\"꺄악!\"");
        await printDots(10, 1000);
        await printLine("GAME OVER");
        await printLine("살인이 성공하였습니다...");
      } else if (b === 2) {
        await printLine("\".....\"");
        await printLine("\"다 너 때문이야...\"");
        await printLine("\"너가 괜히 끼어들어서...\"");
        await printLine("(식칼을 들며)\"죽여버리고 싶어...\"");
        await printDots(10, 1000);
        story.innerText = "";
        await printLine("생존자");
        await printDots(5, 1000);
        await printLine("0명");
        await printLine("살인자가 죽었습니다.");
        await printLine("그와 함께 마지막 생존자가 미쳐 버렸습니다...");
        await printLine("GAME OVER");
        await printDots();
      }
    }

    async function fullEnding3() {
      const lines = [
        "\"...\"", "\"가지 마...\"", "\"응?\"", "\"가지 말라고...\"", "\"......\"",
        "\"하...\"", "\"알았어...\"", "\"내일 다시 한 번 찾아보자\"", "\"응...\"",
        "그날 밤...", "\"...\"", "\"이제 그만해\"", "\"...\"", "\"너 여기 있는 거 알아\"",
        "\"...\"", "\"예전 일은 잊어버리고 이제 그만 하자고\"", "\"...\"",
        "\"너...\"", "\"왜 그런 거야...\"", "\"난...\"", "\"그 도둑 고양이를...\"",
        "\"나, 이런 건 싫어\"", "\"...\"", "\"내일 보자,\"", "\"이로운\"", "\"...\"",
        "다음날...", "\"일어나!!!\"", "\"음...zzz\"", "\"일!어!나!!!!!\"", "\"아, 5분만 더...\"",
        "\"아, 차가!\"", "\"크크킄ㅋㅋㅋ\"", "\"아, 진짜......어?\"", "\"왜 그래?\"",
        "\"너...돌아왔...\"", "\"야, 나유준, 어디 갔었어?\"", "\"왜, 보고 싶었냐?\"",
        "\"그랬겠냐?\"", "\"아, 좀 서운하다, 내가 엄청난 일을 했는데...\"", "\"또 뭔데?\"",
        "\"이 몸이 토끼 마녀한테서 살아 돌아왔다, 이말이야!\"",
        "\"거짓말도 좀 작작 해, 진짜\"", "\"거짓말 아니거든?!\"", "\"이게 무슨 일...\"",
        "\"윤아야, 넌 나 안 보고 싶었냐?\"", "\"그랬겠냐고\"", "\"흑흑...마상...\"",
        "\"으휴, 진짜 어린애가 따로 없어!\"", "\"어, 이로운!\"", "\"?!\"", "\"안...안녕...\"",
        "\"왜 이제 와~\"", "\"아, 그게...\"", "\"괜찮으니까 됐고, 돌아가기 전에 뭐라도 남겨야지, 응?\"",
        "\"응?\"", "\"자, 찍는다?\"", "\"아, 하지마...\"", "\"한 장만 찍자...응?\"",
        "\"부끄럽다고...\"", "\"자, 그러지 말고...\"", "\"하나...\"", "\"둘...\"", "\"셋!\""
      ];
      for (const line of lines) {
        await printLine(line);
      }
      await printDots(10, 1000);
      await printLine("WINNER!!!");
      await printLine("살인은 당신의 선택으로 취소되었습니다");
      await printLine("자, 그럼 마지막으로 살인에 참여한 사람을 모두 고르시오");
      await printLine("1.나유준 2.채윤호 3.노윤아 4.이로운");

      choices.innerHTML = `
        <input type="number" id="ans1" min="1" max="4"> 
        <input type="number" id="ans2" min="1" max="4">
        <button onclick="checkAnswer()">제출</button>
      `;
    }

    function checkAnswer() {
      const a = parseInt(document.getElementById("ans1").value);
      const b = parseInt(document.getElementById("ans2").value);
      story.innerText += "\n";
      if ((a === 2 && b === 4) || (a === 4 && b === 2)) {
        story.innerText += "완벽한 추리입니다!\nGAME CLEAR";
      } else {
        story.innerText += "당신은 다음 살인을 막지 못했습니다...\nGAME OVER";
      }
      choices.innerHTML = "";
    }

    startStory();
  </script>
</body>
</html>
